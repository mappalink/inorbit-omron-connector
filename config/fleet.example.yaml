common:
  location_tz: Europe/Amsterdam
  connector_type: OmronARCL
  connector_version: "0.1.0"

  env_vars:
    INORBIT_API_KEY: "${INORBIT_API_KEY}"

  arcl_port: 7171
  arcl_password: "${OMRON_ARCL_PASSWORD}"
  poll_frequency: 1.0

  map_file: "/config/omron_map.png"
  map_resolution: 0.02
  map_origin_x: -4.46
  map_origin_y: -8.94

  # Laser scanner names (empty = no laser publishing)
  laser_names:
    - "Laser_1"
    - "Laser_2"
    - "Laser_3"
  # laser_angle_min: -3.14159  # -pi (full 360°)
  # laser_angle_max: 3.14159   # +pi
  # laser_range_max: 30.0      # meters
  # laser_n_points: 720        # 360° at 0.5° resolution

  # Edge executor mission persistence (optional, defaults to missions_<robot_id>.db)
  # mission_database_file: "/data/missions.db"

  # Workbench lifting-column PLCs (Beckhoff TwinCAT over ADS) for table
  # transport missions. plc_client_ams_net_id is the identity this connector
  # declares — it must equal the client AmsNetId in the static ADS route on
  # each PLC. Heights are per-workbench mission parameters (mm).
  # plc_client_ams_net_id: "10.102.0.18.1.1"
  # plc_deadband_mm: 10           # match the PLC's deadband
  # plc_move_timeout_secs: 120.0         # full 800-1131 stroke takes ~55 s at ~6 mm/s
  # plc_check_position_valid: false  # enable once g_xPositionValid exists
  # plc_tables:
  #   wb1:
  #     ip: "10.102.x.y"
  #     ams_net_id: "5.155.201.89.1.1"  # the TwinCAT system AmsNetId (read it off the IPC; NOT <ip>.1.1)
  #     heights:
  #       retracted: 800
  #       pickup: 1131

omron-hd1500:
  robot_name: "Omron HD1500"
  arcl_host: "10.200.0.2"
  map_id: "omron_heal"
